<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport">
        <title>Criminal Records Databases</title>
        <style>
        body{
            color:white;
            background-color:#f4f6f8;
        }
        header{ 
            background-color:rgb(2, 2, 109);
            color:white;
            padding:10px;
            text-align:center;
        }
        nav{
            background-color:rgb(1, 1, 68);
            padding:15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-main a {
            color:white;
            text-decoration: none;
            margin:0 15px;
            font-weight:bold;
            transition: color 0.3s;
        }
        .nav-main a:hover{
            color: rgb(150, 200, 255);
        }
        .nav-auth {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .btn-register, .btn-login {
            padding: 8px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s ease;
            color: white;
            border: 2px solid transparent;
        }
        .btn-register {
            background-color: #28a745;
            box-shadow: 0 4px 6px rgba(40, 167, 69, 0.3);
        }
        .btn-register:hover {
            background-color: transparent;
            color: #28a745;
            border-color: #28a745;
            box-shadow: 0 0 12px rgba(40, 167, 69, 0.6);
            transform: translateY(-2px);
        }
        .btn-login {
            background-color: #007bff;
            box-shadow: 0 4px 6px rgba(0, 123, 255, 0.3);
        }
        .btn-login:hover {
            background-color: transparent;
            color: #007bff;
            border-color: #007bff;
            box-shadow: 0 0 12px rgba(0, 123, 255, 0.6);
            transform: translateY(-2px);
        }
        .hero{
            text-align:center;
            background-color:white;
            color:darkblue;
        }
        .hero h2{
            background-color:white;
            color:darkblue;
            margin-bottom:5px;
        }
        .record-container{
            display:flex;
            justify-content:space-around;
            gap:15px;
            padding:10px;
        }
        .record-card{
            background-color:rgb(2, 2, 109);
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px;
            transition: transform 0.3s;
        }
        .record-card:hover{
            transform:scale(1.05)
        }
        .record-card h3{
            margin-bottom:10px;
            color:white;
            text-align:center;
        }
        .table-section{
            padding:30px;
        }
        table{
            width:80%;
            border-collapse: collapse;
            background-color:white;
        }
        th,td{
            color:black;
            border:1px solid #ccc;
            padding:12px;
            text-align:center;
        }
        th{
            background-color:darkblue;
            color:white; /* Changed to white for better contrast */
        }
        .add-form-container {
            background-color: white;
            color: darkblue;
            padding: 20px;
            margin: 20px auto;
            width: 80%;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .add-form-container input {
            padding: 8px;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .add-form-container button {
            padding: 10px 15px;
            background-color: darkblue;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
    </head>
    <body>
        <header>
            <h1>Criminal Records</h1>
            <a href="forms.html"><img src="images/profile.webp" height="26px" width="26px"></a>
            <p>Official crime information portal</p>
        </header>
        <nav>
            <div class="nav-main">
                <a href="home.html">Home</a>
                <a href="records.html">Records</a>
                <a href="search.html">Search</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </div>
            <div class="nav-auth">
                <a href="registration.html" class="btn-register">Register</a>
                <a href="login.html" class="btn-login">Login</a>
            </div>
        </nav>
        <section class="hero">
            <h2>Criminal Records Management System</h2>
            <p>Information about criminals</p>
        </section>

        <section class="add-form-container" align="center">
            <h3>Add New Record</h3>
            <form id="add-record-form">
                <input type="text" id="r-name" placeholder="Name" required>
                <input type="text" id="r-case" placeholder="Case No" required>
                <input type="text" id="r-crime" placeholder="Crime" required>
                <input type="text" id="r-status" placeholder="Status" required>
                <button type="submit">Add Record</button>
            </form>
        </section>
        <section class="records" align="center">
            <h2 style="color:darkblue">Criminal Profiles</h2>
            <div class="record-container" id="cards-container">
            </div>
        </section>
        <section class="Table section">
            <h2 style="text-align:center;margin-bottom:20px;color:darkblue;">
            Criminal Record Table</h2>
            <table align="center">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Case No</th>
                        <th>Crime</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                </tbody>
            </table>
        </section>


        <script src="java.js"></script>
    </body>

</html>
